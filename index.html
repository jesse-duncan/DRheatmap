<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DR Agricultural Production Heat Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
    #map { width: 100%; height: 100vh; cursor: grab; }
    #map:active { cursor: grabbing; }
    .filter-panel { padding: 10px 14px; background: rgba(255,255,255,0.95); box-shadow: 0 0 15px rgba(0,0,0,0.2); border-radius: 5px; font-size: 13px; }
    .filter-panel label { font-weight: bold; display: block; margin-bottom: 5px; color: #333; }
    .filter-panel select { width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; }
    .info-panel { padding: 12px 16px; font: 14px/16px Arial, sans-serif; background: rgba(255,255,255,0.95); box-shadow: 0 0 15px rgba(0,0,0,0.2); border-radius: 5px; min-width: 200px; }
    .info-panel h4 { margin: 0 0 8px; color: #333; }
    .legend { line-height: 18px; color: #555; background: white; padding: 10px; border-radius: 5px; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
    .legend-bar { height: 15px; width: 100%; background: linear-gradient(to right, hsl(30,100%,50%), hsl(60,100%,50%), hsl(120,100%,40%), hsl(195,100%,50%)); margin-bottom: 5px; border-radius: 2px; }
    .legend-labels { display: flex; justify-content: space-between; font-size: 11px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <script>
    const maxPanBounds = L.latLngBounds(L.latLng(17.0, -72.5), L.latLng(20.5, -68.0));

    const map = L.map('map', {
      preferCanvas: true,
      maxBounds: maxPanBounds,
      maxBoundsViscosity: 1.0,
      minZoom: 7
    }).setView([18.7357, -70.1627], 8);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    function getColor(value, maxVal) {
      if (!value || value <= 0) return 'transparent';
      const ratio = Math.min(value / maxVal, 1);
      return `hsl(${ratio * 195}, 85%, 45%)`;
    }

    const bounds = { minLat: 17.4, maxLat: 19.9, minLng: -72.0, maxLng: -68.3 };
    const step = 0.03;
    let selectedCrop = "all";

    const hotspots = [
      { lat: 19.39, lng: -70.53, radius: 0.35, crops: { "Plantains": 180000000, "Vegetables": 50000000 } },
      { lat: 19.22, lng: -70.53, radius: 0.40, crops: { "Rice": 150000000, "Plantains": 120000000 } },
      { lat: 18.91, lng: -70.74, radius: 0.25, crops: { "Vegetables": 180000000 } },
      { lat: 19.12, lng: -70.63, radius: 0.25, crops: { "Vegetables": 70000000, "Coffee": 30000000 } },
      { lat: 19.55, lng: -71.07, radius: 0.35, crops: { "Bananas": 160000000, "Rice": 90000000 } },
      { lat: 19.45, lng: -70.70, radius: 0.35, crops: { "Plantains": 90000000, "Tobacco": 60000000 } },
      { lat: 19.30, lng: -70.25, radius: 0.40, crops: { "Cacao": 140000000, "Rice": 110000000 } },
      { lat: 19.38, lng: -69.85, radius: 0.35, crops: { "Coconut": 130000000, "Rice": 80000000 } },
      { lat: 19.20, lng: -69.33, radius: 0.30, crops: { "Coconut": 90000000 } },
      { lat: 19.63, lng: -71.44, radius: 0.35, crops: { "Bananas": 110000000, "Rice": 50000000 } },
      { lat: 19.55, lng: -71.70, radius: 0.30, crops: { "Rice": 40000000, "Beans": 30000000 } },
      { lat: 18.42, lng: -70.50, radius: 0.30, crops: { "Mangoes": 110000000 } },
      { lat: 18.45, lng: -70.73, radius: 0.35, crops: { "Bananas": 80000000, "Mangoes": 60000000 } },
      { lat: 18.42, lng: -70.10, radius: 0.30, crops: { "Vegetables": 40000000, "Cacao": 30000000 } },
      { lat: 18.81, lng: -71.23, radius: 0.45, crops: { "Beans": 130000000, "Rice": 90000000 } },
      { lat: 18.48, lng: -71.42, radius: 0.30, crops: { "Plantains": 60000000, "Grapes": 20000000 } },
      { lat: 18.21, lng: -71.10, radius: 0.35, crops: { "Sugarcane": 140000000, "Coffee": 35000000 } },
      { lat: 18.03, lng: -71.74, radius: 0.25, crops: { "Coffee": 20000000 } },
      { lat: 18.43, lng: -68.97, radius: 0.45, crops: { "Sugarcane": 450000000 } },
      { lat: 18.55, lng: -69.25, radius: 0.40, crops: { "Sugarcane": 250000000 } },
      { lat: 18.76, lng: -69.25, radius: 0.35, crops: { "Cacao": 70000000, "Citrus": 50000000 } },
      { lat: 18.90, lng: -69.04, radius: 0.35, crops: { "Cacao": 80000000 } },
      { lat: 18.62, lng: -68.71, radius: 0.40, crops: { "Sugarcane": 120000000 } }
    ];

    const GRID_HASHMAP = {};
    const PRECOMPUTED_GRID = [];
    const gridGroup = L.layerGroup().addTo(map);

    // Fetch official DR boundary data for high detail
    const DR_GEOJSON_URL = "https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson";

    fetch(DR_GEOJSON_URL)
      .then(res => res.json())
      .then(data => {
        const drFeature = data.features.find(f => 
          f.properties.ISO_A3 === "DOM" || f.properties.ADMIN === "Dominican Republic"
        );

        L.geoJSON(drFeature, { style: { color: '#222', weight: 1.5, fill: false } }).addTo(map);

        // Compute grid inside precise boundary
        for (let lat = bounds.minLat; lat < bounds.maxLat; lat += step) {
          for (let lng = bounds.minLng; lng < bounds.maxLng; lng += step) {
            const centerLat = lat + step / 2;
            const centerLng = lng + step / 2;

            if (!turf.booleanPointInPolygon(turf.point([centerLng, centerLat]), drFeature)) continue;

            let cropTotals = {};
            let totalYield = 0;

            hotspots.forEach(spot => {
              const dist = Math.hypot(centerLat - spot.lat, centerLng - spot.lng);
              if (dist < spot.radius) {
                const factor = Math.max(0, 1 - dist / spot.radius);
                for (const [crop, weight] of Object.entries(spot.crops)) {
                  const val = weight * factor;
                  cropTotals[crop] = (cropTotals[crop] || 0) + val;
                  totalYield += val;
                }
              }
            });

            if (totalYield > 0) {
              const cellData = {
                lat, lng, centerLat, centerLng,
                totalYield: Math.round(totalYield),
                crops: cropTotals
              };
              
              PRECOMPUTED_GRID.push(cellData);
              const key = `${lat.toFixed(2)}_${lng.toFixed(2)}`;
              GRID_HASHMAP[key] = cellData;
            }
          }
        }

        renderGrid();
      });

    function renderGrid() {
      gridGroup.clearLayers();
      const maxProduction = selectedCrop === "all" ? 450000000 : 200000000;
      const rectLayers = [];

      PRECOMPUTED_GRID.forEach(cell => {
        let lbs = selectedCrop === "all" ? cell.totalYield : Math.round(cell.crops[selectedCrop] || 0);
        if (lbs <= 0) return;

        rectLayers.push(L.rectangle([[cell.lat, cell.lng], [cell.lat + step, cell.lng + step]], {
          stroke: false,
          fillColor: getColor(lbs, maxProduction),
          fillOpacity: 0.7,
          interactive: false
        }));
      });

      if (rectLayers.length > 0) {
        gridGroup.addLayer(L.featureGroup(rectLayers));
      }
    }

    // Low-overhead O(1) hover lookup using spatial hash keys
    let isTicking = false;
    map.on('mousemove', function(e) {
      if (!isTicking) {
        window.requestAnimationFrame(() => {
          const snapLat = (Math.floor(e.latlng.lat / step) * step).toFixed(2);
          const snapLng = (Math.floor(e.latlng.lng / step) * step).toFixed(2);
          
          const cell = GRID_HASHMAP[`${snapLat}_${snapLng}`];

          if (cell) {
            const lbs = selectedCrop === "all" ? cell.totalYield : Math.round(cell.crops[selectedCrop] || 0);
            if (lbs > 0) {
              infoPanel.update({
                lat: cell.centerLat.toFixed(3),
                lng: cell.centerLng.toFixed(3),
                lbs: lbs.toLocaleString(),
                crop: selectedCrop === "all" ? Object.keys(cell.crops).join(", ") : selectedCrop
              });
              isTicking = false;
              return;
            }
          }
          infoPanel.update();
          isTicking = false;
        });
        isTicking = true;
      }
    });

    const filterPanel = L.control({ position: 'topleft' });
    filterPanel.onAdd = function () {
      const div = L.DomUtil.create('div', 'filter-panel');
      div.innerHTML = `
        <label for="cropSelect">Select Crop / Commodity:</label>
        <select id="cropSelect">
          <option value="all">All Commodities (Total Yield)</option>
          <option value="Plantains">Plantains</option>
          <option value="Rice">Rice</option>
          <option value="Sugarcane">Sugarcane</option>
          <option value="Vegetables">Vegetables</option>
          <option value="Bananas">Bananas</option>
          <option value="Mangoes">Mangoes</option>
          <option value="Beans">Beans</option>
          <option value="Coconut">Coconut</option>
          <option value="Cacao">Cacao</option>
          <option value="Coffee">Coffee</option>
        </select>
      `;
      L.DomEvent.disableClickPropagation(div);
      return div;
    };
    filterPanel.addTo(map);

    document.getElementById('map').addEventListener('change', function (e) {
      if (e.target && e.target.id === 'cropSelect') {
        selectedCrop = e.target.value;
        renderGrid();
      }
    });

    const infoPanel = L.control({ position: 'topright' });
    infoPanel.onAdd = function () {
      this._div = L.DomUtil.create('div', 'info-panel');
      this.update();
      return this._div;
    };
    infoPanel.update = function (props) {
      this._div.innerHTML = '<h4>Agricultural Output</h4>' + (props ?
        `<b>Location:</b> ${props.lat}°N, ${props.lng}°W<br />` +
        `<b>Crop(s):</b> ${props.crop}<br />` +
        `<b>Est. Yield:</b> ${props.lbs} lbs`
        : 'Hover over a grid cell');
    };
    infoPanel.addTo(map);

    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML = `
        <strong>Production Gradient</strong>
        <div class="legend-bar"></div>
        <div class="legend-labels">
          <span>Low Yield</span>
          <span>Mid Yield</span>
          <span>High Yield</span>
        </div>
      `;
      return div;
    };
    legend.addTo(map);
  </script>
</body>
</html>
